version: '3.9'

services:
  db:
    image: postgres:18-alpine
    container_name: friedhof-db
    environment:
      POSTGRES_DB: friedhofverwaltung
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 4DK88W61f56a17xK
    ports:
      - "5423:5432"  # host:container
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: pfarrhoferphilip/friedhof-backend
    container_name: friedhof-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/friedhofverwaltung
      QUARKUS_DATASOURCE_USERNAME: admin
      QUARKUS_DATASOURCE_PASSWORD: 4DK88W61f56a17xK
    ports:
      - "8080:8080"
    networks:
      - backend

  frontend:
    image: pfarrhoferphilip/friedhof-frontend
    container_name: friedhof-frontend
    ports:
      - "4200:80"  # Host port 4200 maps to nginx's port 80
    networks:
      - backend

networks:
  backend:
