<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-sm bg-white rounded-xl shadow-lg p-6">

    <h1 class="text-2xl font-bold text-center mb-6">
      Admin Login
    </h1>

    <form class="space-y-4" (ngSubmit)="submit()">

      <!-- Passwort -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Passwort
        </label>
        <input
          type="password"
          required
          [(ngModel)]="passwordForm"
          [ngModelOptions]="{standalone: true}"
          placeholder="Passwort eingeben"
          class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
      </div>

      <!-- Button -->
      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition"
      >
        Login
      </button>

    </form>

  </div>
</div>
